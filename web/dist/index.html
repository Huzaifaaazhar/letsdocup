<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BL Manager</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.css" />
<style>
  body { margin: 0; font-family: "Source Sans Pro", system-ui, sans-serif; background: #fff; color: #1A1F2B; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; z-index: 10; }
  #boot .box { max-width: 520px; padding: 24px; text-align: center; }
  #boot h1 { font-size: 1.6rem; margin: 0 0 6px 0; color: #1F3B73; }
  #boot p { color: #5A6478; line-height: 1.5; }
  #boot .bar { height: 4px; background: #E1E5EE; border-radius: 2px; overflow: hidden; margin-top: 18px; }
  #boot .bar div { height: 100%; width: 40%; background: #1F3B73; animation: slide 1.4s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
</style>
</head>
<body>
<div id="boot"><div class="box">
  <h1>BL Manager</h1>
  <p>Loading the application into your browser&hellip;<br/>
  The first visit takes about 20&ndash;40 seconds. Later visits are faster.<br/>
  <strong>Your PDFs are processed inside this browser and are never uploaded to a server.</strong></p>
  <div class="bar"><div></div></div>
</div></div>
<div id="root"></div>
<script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.2/build/stlite.js";
const files = ["app.py", "bl_manager/__init__.py", "bl_manager/classification.py", "bl_manager/consol.py", "bl_manager/constants.py", "bl_manager/db.py", "bl_manager/exports.py", "bl_manager/extraction.py", "bl_manager/labels.py", "bl_manager/normalize.py", "bl_manager/page_parser.py", "bl_manager/pdf_reader.py", "bl_manager/pipeline.py", "bl_manager/reconstruction.py", "ui/__init__.py", "ui/batches.py", "ui/bl_view.py", "ui/common.py", "ui/dashboard.py", "ui/folders.py", "ui/forwarders.py", "ui/settings_page.py", "ui/upload.py", "tools/__init__.py", "tools/make_sample_pdfs.py", "tests/__init__.py", "tests/synthetic.py"];
const fileMap = {};
for (const f of files) fileMap[f] = { url: "./app/" + f };
mount({
  entrypoint: "app.py",
  files: fileMap,
  requirements: ["pymupdf", "pandas", "openpyxl", "reportlab==4.2.5"],
  streamlitConfig: {"server.maxUploadSize": 1000, "client.toolbarMode": "viewer", "browser.gatherUsageStats": false, "theme.base": "light", "theme.primaryColor": "#1F3B73", "theme.backgroundColor": "#FFFFFF", "theme.secondaryBackgroundColor": "#F3F5F9", "theme.textColor": "#1A1F2B"},
  idbfsMountpoints: ["/mnt"],
}, document.getElementById("root"));
const hide = () => { const b = document.getElementById("boot"); if (b) b.remove(); };
const obs = new MutationObserver(() => {
  if (document.querySelector('[data-testid="stSidebar"], [data-testid="stMain"]')) { hide(); obs.disconnect(); }
});
obs.observe(document.body, { childList: true, subtree: true });
setTimeout(hide, 120000);
</script>
</body>
</html>
